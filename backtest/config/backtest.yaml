# 回测系统配置文件
# 与生产 config/settings.yaml 解耦，回测专用参数在此设置
# override 节点中的参数会覆盖 settings.yaml 对应值，用于参数优化

backtest:
  # ── 回测时间区间 ──────────────────────────────
  start_date: "2026-04-15"
  end_date:   "2026-05-03"

  # ── 回测账户 ──────────────────────────────────
  initial_balance: 100.0     # 初始资金 (USDT)
  leverage: 10                  # 杠杆倍数（与生产一致）

    # ── 成本模型 ──────────────────────────────────
  fee_rate: 0.0005              # taker 手续费率 (OKX 合约 0.05%)
  slippage_pct: 0.001           # 滑点百分比 (0.1%，保守估计)

  # ── 信号触发频率 ──────────────────────────────
  # 每隔多少根最低周期 bar 触发一次信号检查
  # 例：最低周期=15m，signal_interval_bars=4 → 每1h检查一次（与生产一致）
  signal_interval_bars: 1

  # ── AI 替代模式 ───────────────────────────────
  # rule_only : 纯规则引擎构造伪AI决策（推荐，可重复执行，无API成本）
  # llm_mock  : 读取预缓存的LLM响应JSON（用于验证AI效果）
  # llm_real  : 调用生产环境真实文本LLM API（用于验证生产LLM逻辑，需API Key）
  ai_mode: "rule_only"

  # ── 下载时间框架 ───────────────────────────────
  # download 子命令默认下载的周期列表（可被 --timeframes 命令行参数覆盖）
  download_timeframes: ["5m", "15m", "30m", "1h"]

  # ── 数据缓存 ──────────────────────────────────
  data_cache_dir: "backtest/data/cache"

  # ── 报告输出 ──────────────────────────────────
  results_dir: "backtest/results"

  # ── 日志级别 ──────────────────────────────────
  log_level: "INFO"             # DEBUG / INFO / WARNING

# ── override 配置 ────────────────────────────────────────────────
override:
  # ── 时段配置（与生产一致：欧洲+美洲，关闭亚洲）──────────────
  trading_sessions:
    enabled: true
    timezone: "UTC+8"
    sessions:
      - name: "europe"
        label: "欧洲时段"
        start_hour: 15
        end_hour: 23
      - name: "americas"
        label: "美洲时段"
        start_hour: 22
        end_hour: 5

  # ── 交易参数（必须与生产保持一致，防止遗漏导致回测失真）─────
  trading:
    min_signal_strength: 7            # ← 必须覆盖：避免回测用默认值7而非生产配置的10
    min_rr_ratio: 2.0
    allowed_confidence: ["high"]
    min_trend_strength: 7
    max_position_pct: 0.20
    max_open_positions: 4

  rule_filter:
    bearish_engulfing_short_ban: true    # ← 生产：bearish_engulfing 做空禁止
    session_short_banned: []             # ← 生产：所有时段允许做空
    short_min_adx: 40                    # ← 生产：做空最低 ADX 要求
    rsi_short_guard_zone: 40             # ← 生产：RSI 低于此值禁止做空
    rsi_neutral_short_ban_upper: 60       # ← 生产：RSI 40-60 中性偏弱区禁止做空
    rsi_neutral_short_ban_lower: 35       # ← 生产：RSI 中性区下界

  # ── 形态仓位（与生产一致：inside_bar/inverted_hammer 降权 50%）──
  # trading:
    # pattern_position_boost:
      # inside_bar: 0.5
      # inverted_hammer: 0.5

  # ── 仓位（与生产一致：20%，最多4持仓）───────────────────────────
  # trading:
    # max_position_pct: 0.20
